name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: PolskiStreamerSymulatorApp/global.json
      - name: Require deployable server project
        shell: bash
        run: |
          test -f PolskiStreamerSymulatorApp/src/Server/Server.csproj || {
            echo 'Server.csproj is required before the first production deployment.' >&2
            exit 1
          }
          dotnet sln PolskiStreamerSymulatorApp/PolskiStreamerSymulatorApp.sln list | grep -Eq 'Tests\.csproj$' || {
            echo 'Add a real test project to the solution before production deployment.' >&2
            exit 1
          }
      - name: Test solution
        working-directory: PolskiStreamerSymulatorApp
        run: dotnet test --solution PolskiStreamerSymulatorApp.sln -c Release
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish image by commit SHA
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$repository"
          docker buildx build \
            --platform linux/amd64 \
            --file deploy/Dockerfile \
            --tag "$image:$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --push \
            --metadata-file image-metadata.json \
            .
          digest=$(python3 -c 'import json; print(json.load(open("image-metadata.json"))["containerimage.digest"])')
          printf 'image=%s@%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy exact image digest over restricted SSH
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY }}
          VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_HOST_KEY"
          test -n "$VPS_DEPLOY_SSH_KEY"
          mkdir -p "$RUNNER_TEMP/pss-ssh"
          chmod 700 "$RUNNER_TEMP/pss-ssh"
          printf '%s\n' "$VPS_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/pss-ssh/key"
          printf '%s\n' "$VPS_SSH_HOST_KEY" > "$RUNNER_TEMP/pss-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/pss-ssh/key" "$RUNNER_TEMP/pss-ssh/known_hosts"
          ssh -i "$RUNNER_TEMP/pss-ssh/key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/pss-ssh/known_hosts" \
            "pss-deploy@$VPS_HOST" "deploy $IMAGE_REF"
