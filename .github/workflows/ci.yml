name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: PolskiStreamerSymulatorApp
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: PolskiStreamerSymulatorApp/global.json
      - name: Restore
        run: dotnet restore PolskiStreamerSymulatorApp.sln
      - name: Check formatting
        run: dotnet format PolskiStreamerSymulatorApp.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build PolskiStreamerSymulatorApp.sln -c Release --no-restore
      - name: Test
        run: dotnet test --solution PolskiStreamerSymulatorApp.sln -c Release --no-build

  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build image
        run: docker buildx build --platform linux/amd64 --file deploy/Dockerfile --tag "pss-ci:$GITHUB_SHA" --load .
      - name: Start container
        id: start
        run: docker run --detach --name pss-ci --publish 8080:8080 "pss-ci:$GITHUB_SHA"
      - name: Wait for liveness
        run: curl --fail --silent --show-error --max-time 5 --output /dev/null --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8080/health/live
      - name: Check readiness and client page
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 5 --output /dev/null http://localhost:8080/health/ready
          body=$(curl --fail --silent --show-error --max-time 5 http://localhost:8080/)
          grep --fixed-strings --quiet '<div id="app">' <<< "$body" || { echo '::error::GET / did not contain <div id="app">'; exit 1; }
      - name: Print container logs
        if: failure() && steps.start.conclusion == 'success'
        run: docker logs pss-ci
